name: Release

# Срабатывает на подписанный тег vX.Y.Z, который создаёт локальный хук
# .githooks/pre-push при переливке beta -> master.
#
# Выпуск — только переносимый архив (решение штаба D-0005): установщика и ленты
# обновлений нет. Переносимую копию везут с собой на объект в папке, и ставить
# её поверх себя же на ходу нельзя; о новой версии клиент говорит сам — по кнопке
# и ссылкой на страницу выпуска. Раскладка архива та же, что у tools/pack-portable.sh:
# сборка здесь и на машине разработки обязана давать одно и то же.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read          # SignPath читает сведения о сборке и скачивает артефакт

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40

    env:
      # Подпись включается сама, как только у репозитория появится токен SignPath.
      # До одобрения заявки шаги подписи пропускаются, а выпуск собирается неподписанным
      # и честно об этом сообщает — см. docs/ARCHITECTURE.md, раздел о подписи.
      HAS_SIGNING: ${{ secrets.SIGNPATH_API_TOKEN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Номер выпуска — из тега, номер продукта — из Directory.Build.props. Тег ставит
      # хук из того же файла, так что разойтись им трудно, но можно: запуском вручную
      # с ветки или тегом, поставленным руками. Выпуск под чужим номером — это архив,
      # окно «О продукте» которого называет другую версию, чем страница, откуда его скачали.
      - name: Номер выпуска совпадает с проектом
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v\d') {
            Write-Host "::error::Выпуск собирается только по тегу vX.Y.Z, а запущен на «$tag»."
            exit 1
          }

          $version = $tag.Substring(1)
          $props = Get-Content Directory.Build.props -Raw -Encoding utf8
          $project = [regex]::Match($props, '<Version>(.*?)</Version>').Groups[1].Value.Trim()

          if ($version -ne $project) {
            Write-Host "::error::Тег $tag, а в Directory.Build.props — $project. Номера обязаны совпадать."
            exit 1
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "name=StormMachine-$version-win-x64-portable" >> $env:GITHUB_OUTPUT

      - name: Есть ли что публиковать
        id: probe
        shell: pwsh
        run: |
          $app = Get-ChildItem -Path src -Filter 'StormMachine.App.csproj' -Recurse -ErrorAction SilentlyContinue
          $cli = Get-ChildItem -Path src -Filter 'StormMachine.Cli.csproj' -Recurse -ErrorAction SilentlyContinue
          if ($app -or $cli) { "found=true" >> $env:GITHUB_OUTPUT }
          else {
            "found=false" >> $env:GITHUB_OUTPUT
            Write-Host "::notice::Публикуемых проектов ещё нет — релиз будет только с исходниками"
          }

      # Клиент и консоль — в одну папку: продукт один, и собирать его из трёх
      # архивов руками значило бы переложить сборку на человека.
      - name: Клиент и консоль (self-contained, single-file)
        if: steps.probe.outputs.found == 'true'
        shell: pwsh
        run: |
          $dest = "artifacts/${{ steps.version.outputs.name }}"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null

          # Параметры публикации (single-file, trimmed, win-x64) заданы в самих .csproj,
          # чтобы локальная сборка и сборка здесь давали идентичный артефакт.
          foreach ($name in @('StormMachine.App', 'StormMachine.Cli')) {
            Write-Host "Публикую $name"
            dotnet publish "src/$name/$name.csproj" --configuration Release --output $dest --nologo
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # Агенты для чужих концов едут ВНУТРИ поставки, а не скачиваются по требованию:
      # станцию носят на объекты, где интернета нет, а агент нужен именно там.
      # Цена — около 33 МБ в сжатом виде против 80 распакованными.
      #
      # Логика та же, что в tools/pack-agent.sh; повторена здесь, потому что подпись
      # встаёт между публикацией и упаковкой, а скрипт делает их за один проход.
      - name: Агенты для чужих концов
        if: steps.probe.outputs.found == 'true'
        shell: pwsh
        run: |
          $dest = "artifacts/${{ steps.version.outputs.name }}"
          $agents = "$dest/agents"
          New-Item -ItemType Directory -Force -Path $agents | Out-Null

          foreach ($rid in @('win-x64', 'linux-x64', 'linux-arm64', 'osx-arm64', 'osx-x64')) {
            Write-Host "Агент для $rid"

            dotnet publish src/StormMachine.Agent/StormMachine.Agent.csproj `
              --configuration Release --runtime $rid --output "artifacts/agents-staging/$rid" `
              --nologo --verbosity quiet

            $binary = Get-ChildItem "artifacts/agents-staging/$rid" -File |
              Where-Object { $_.Name -like 'storm-agent*' -and $_.Extension -ne '.pdb' } |
              Select-Object -First 1

            if (-not $binary) {
              Write-Host "::error::Для $rid не собрался агент — комплект для этой платформы выдать будет нельзя"
              exit 1
            }

            Compress-Archive -Path $binary.FullName `
              -DestinationPath "$agents/storm-agent-$rid.zip" -CompressionLevel Optimal -Force

            # Распакованный — только для своей платформы: им пользуются прямо здесь.
            if ($rid -eq 'win-x64') { Copy-Item $binary.FullName "$dest/storm-agent.exe" -Force }
          }

          Get-ChildItem $agents | ForEach-Object { "{0,-32} {1,6:N1} МБ" -f $_.Name, ($_.Length / 1MB) } | Write-Host

      # Окно агента — только Windows и только распакованным рядом с клиентом.
      # В комплект для площадки оно не кладётся: весит втрое больше самого агента,
      # а качают комплект по чужому каналу.
      - name: Окно агента
        if: steps.probe.outputs.found == 'true'
        shell: pwsh
        run: |
          dotnet publish src/StormMachine.Agent.Gui/StormMachine.Agent.Gui.csproj `
            --configuration Release --output artifacts/agent-ui --nologo --verbosity quiet

          $window = "artifacts/agent-ui/storm-agent-ui.exe"

          if (-not (Test-Path $window)) {
            Write-Host "::error::Окно агента не собралось"
            exit 1
          }

          Copy-Item $window "artifacts/${{ steps.version.outputs.name }}/storm-agent-ui.exe" -Force
          "{0,6:N1} МБ  storm-agent-ui.exe" -f ((Get-Item $window).Length / 1MB) | Write-Host

      # Маркер и есть вся портативность: по нему продукт держит базу, настройки
      # и журнал рядом с собой, а не в профиле пользователя. Текст маркера — один файл
      # на обе сборки, tools/portable-marker.txt.
      #
      # Отладочные символы в архив не идут: одни только libSkiaSharp.pdb
      # и libHarfBuzzSharp.pdb весят 105 МБ и человеку на объекте не нужны.
      # Символы восстанавливаются из той же сборки, когда понадобятся.
      - name: Маркер переносимости
        if: steps.probe.outputs.found == 'true'
        shell: pwsh
        run: |
          $dest = "artifacts/${{ steps.version.outputs.name }}"
          Get-ChildItem $dest -Recurse -Filter '*.pdb' | Remove-Item -Force
          Copy-Item tools/portable-marker.txt "$dest/storm.portable" -Force
          Get-ChildItem $dest | ForEach-Object { "{0,-28} {1,8:N1} МБ" -f $_.Name, ($_.Length / 1MB) } | Write-Host

      # ------------------------------------------------------------------ подпись
      #
      # SignPath Foundation подписывает выпуски открытых проектов бесплатно.
      # Порядок подачи заявки — docs/SIGNPATH.md. Условия со стороны продукта
      # выполнены: лицензия MIT, воспроизводимая сборка (Deterministic +
      # ContinuousIntegrationBuild), выпуск собирается только из CI по подписанному тегу.
      #
      # Подписываются исполняемые файлы в папке до упаковки: подпись внутри архива
      # и есть то, что увидят SmartScreen и Defender при каждом запуске. Установщика,
      # которому нужна была бы вторая подпись поверх, больше нет.
      - name: Бинарники на подпись
        id: unsigned-app
        if: steps.probe.outputs.found == 'true' && env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-app
          path: artifacts/${{ steps.version.outputs.name }}

      - name: Подпись бинарников
        if: steps.probe.outputs.found == 'true' && env.HAS_SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: storm-machine
          signing-policy-slug: release-signing
          artifact-configuration-slug: app-files
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: artifacts/${{ steps.version.outputs.name }}

      # Что уходит человеку: переносимый архив целиком и, отдельно, агенты по платформам.
      # Отдельные агенты — для того, кто ставит вторую точку на Linux или macOS и качает
      # её прямо там: тянуть ради этого сотню мегабайт клиента для Windows незачем.
      # Это те же архивы, что лежат в agents/ внутри переносимого, — после подписи.
      #
      # Суммы — с переводом строки LF и строчными буквами, как у sha256sum: агентов
      # проверяют и на Linux, а «sha256sum -c» спотыкается о CRLF в имени файла.
      - name: Архивы и контрольные суммы
        if: steps.probe.outputs.found == 'true'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $name = "${{ steps.version.outputs.name }}"
          New-Item -ItemType Directory -Force -Path out | Out-Null

          Compress-Archive -Path "artifacts/$name/*" -DestinationPath "out/$name.zip" -CompressionLevel Optimal -Force

          foreach ($zip in Get-ChildItem "artifacts/$name/agents" -Filter 'storm-agent-*.zip') {
            $rid = $zip.BaseName -replace '^storm-agent-', ''
            Copy-Item $zip.FullName "out/storm-agent-$version-$rid.zip"
          }

          $lines = Get-ChildItem out -Filter '*.zip' | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          }
          [IO.File]::WriteAllText("$PWD/out/SHA256SUMS.txt", (($lines -join "`n") + "`n"))
          $lines | Write-Host

      - name: Предупреждение о неподписанном выпуске
        if: steps.probe.outputs.found == 'true' && env.HAS_SIGNING != 'true'
        shell: pwsh
        run: |
          Write-Host "::warning::Выпуск не подписан: токен SignPath не задан. SmartScreen покажет предупреждение при первом запуске StormMachine.exe. Проверять скачанное — по SHA256SUMS.txt."

      # Описание выпуска берётся из docs/RELEASES.md — раздел этой версии целиком.
      # До этого шапка RELEASES.md обещала «из этого файла берётся описание выпуска»,
      # а на деле GitHub собирал описание сам из заголовков коммитов, и написанное
      # для человека до страницы выпуска не доходило.
      #
      # Записи нет — выпуск не собирается. Мягкий вариант («соберём без описания»)
      # кончается черновиком, который публикуют не глядя: у пользователя на руках
      # архив без единого слова о том, что в нём и чего от него не ждать.
      - name: Описание выпуска из RELEASES.md
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $text = Get-Content docs/RELEASES.md -Raw -Encoding utf8

          # Пробел после номера обязателен: иначе «0.2.0» совпало бы с «0.2.0-alpha.3».
          $pattern = '(?ms)^## ' + [regex]::Escape($version) + '\s.*?(?=^---\s*$|^## |\z)'
          $found = [regex]::Match($text, $pattern)

          if (-not $found.Success) {
            Write-Host "::error::В docs/RELEASES.md нет раздела «## $version» — выпуск без описания не собирается."
            exit 1
          }

          # Места, оставленные под итог, который знает только оператор (боевые тесты),
          # помечены [[ВПИСАТЬ: …]]. Черновик с такой пометкой опубликовали бы не глядя —
          # тем же путём, что и черновик без описания.
          if ($found.Value -match '\[\[ВПИСАТЬ') {
            Write-Host "::error::В разделе «## $version» docs/RELEASES.md остались места [[ВПИСАТЬ: …]] — заполните их перед выпуском."
            exit 1
          }

          $found.Value.Trim() | Set-Content release-notes.md -Encoding utf8
          Get-Content release-notes.md -TotalCount 3 | Write-Host

      - name: Создание релиза
        uses: softprops/action-gh-release@v2
        with:
          name: Storm Machine ${{ github.ref_name }}
          # Сначала написанное человеком, под ним — список изменений, собранный GitHub.
          body_path: release-notes.md
          generate_release_notes: true
          draft: true          # черновик: оператор проверяет и публикует вручную
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            out/*.zip
            out/SHA256SUMS.txt
