name: Release

# Срабатывает на подписанный тег vX.Y.Z, который создаёт локальный хук
# .githooks/pre-push при переливке beta -> master.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read          # SignPath читает сведения о сборке и скачивает артефакт

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40

    env:
      # Подпись включается сама, как только у репозитория появится токен SignPath.
      # До одобрения заявки шаги подписи пропускаются, а выпуск собирается неподписанным
      # и честно об этом сообщает — см. docs/ARCHITECTURE.md, раздел о подписи.
      HAS_SIGNING: ${{ secrets.SIGNPATH_API_TOKEN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Восстановление локальных инструментов
        run: dotnet tool restore

      - name: Есть ли что публиковать
        id: probe
        shell: pwsh
        run: |
          $app = Get-ChildItem -Path src -Filter 'StormMachine.App.csproj' -Recurse -ErrorAction SilentlyContinue
          $cli = Get-ChildItem -Path src -Filter 'StormMachine.Cli.csproj' -Recurse -ErrorAction SilentlyContinue
          if ($app -or $cli) { "found=true" >> $env:GITHUB_OUTPUT }
          else {
            "found=false" >> $env:GITHUB_OUTPUT
            Write-Host "::notice::Публикуемых проектов ещё нет — релиз будет только с исходниками"
          }

      - name: Publish (self-contained, single-file)
        if: steps.probe.outputs.found == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          # Параметры публикации (single-file, trimmed, win-x64) заданы в самих .csproj,
          # чтобы локальная сборка и сборка здесь давали идентичный артефакт.
          foreach ($name in @('StormMachine.App', 'StormMachine.Cli', 'StormMachine.Agent')) {
            $proj = Get-ChildItem -Path src -Filter "$name.csproj" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $proj) { continue }
            Write-Host "Публикую $name"
            dotnet publish $proj.FullName --configuration Release --output "artifacts/$name"
          }

      # Агенты для чужих концов едут ВНУТРИ поставки, а не скачиваются по требованию:
      # станцию носят на объекты, где интернета нет, а агент нужен именно там.
      # Цена — около 33 МБ в сжатом виде против 80 распакованными.
      #
      # Логика та же, что в tools/pack-agent.sh; повторена здесь, потому что шаг обязан
      # работать на чистом раннере без Git Bash, а не вызывать скрипт, которого там нет.
      - name: Агенты для чужих концов
        if: steps.probe.outputs.found == 'true'
        shell: pwsh
        run: |
          $agents = "artifacts/StormMachine.App/agents"
          New-Item -ItemType Directory -Force -Path $agents | Out-Null

          foreach ($rid in @('win-x64', 'linux-x64', 'linux-arm64', 'osx-arm64', 'osx-x64')) {
            Write-Host "Агент для $rid"

            dotnet publish src/StormMachine.Agent/StormMachine.Agent.csproj `
              --configuration Release --runtime $rid --output "artifacts/agents/$rid" `
              --nologo --verbosity quiet

            $binary = Get-ChildItem "artifacts/agents/$rid" -File |
              Where-Object { $_.Name -like 'storm-agent*' -and $_.Extension -ne '.pdb' } |
              Select-Object -First 1

            if (-not $binary) {
              Write-Host "::error::Для $rid не собрался агент — комплект для этой платформы выдать будет нельзя"
              exit 1
            }

            Compress-Archive -Path $binary.FullName `
              -DestinationPath "$agents/storm-agent-$rid.zip" -CompressionLevel Optimal -Force
          }

          Get-ChildItem $agents | ForEach-Object { "{0,-32} {1,6:N1} МБ" -f $_.Name, ($_.Length / 1MB) } | Write-Host

      # Окно агента — только Windows и только распакованным рядом с клиентом.
      # В комплект для площадки оно не кладётся: весит втрое больше самого агента,
      # а качают комплект по чужому каналу.
      - name: Окно агента
        if: steps.probe.outputs.found == 'true'
        shell: pwsh
        run: |
          dotnet publish src/StormMachine.Agent.Gui/StormMachine.Agent.Gui.csproj `
            --configuration Release --output artifacts/agent-ui --nologo --verbosity quiet

          $window = "artifacts/agent-ui/storm-agent-ui.exe"

          if (-not (Test-Path $window)) {
            Write-Host "::error::Окно агента не собралось"
            exit 1
          }

          Copy-Item $window "artifacts/StormMachine.App/storm-agent-ui.exe" -Force
          "{0,6:N1} МБ  storm-agent-ui.exe" -f ((Get-Item $window).Length / 1MB) | Write-Host

      # ------------------------------------------------------------------ подпись
      #
      # SignPath Foundation подписывает выпуски открытых проектов бесплатно.
      # Порядок подачи заявки — docs/SIGNPATH.md. Условия со стороны продукта
      # выполнены: лицензия MIT, воспроизводимая сборка (Deterministic +
      # ContinuousIntegrationBuild), выпуск собирается только из CI по подписанному тегу.
      #
      # Подпись идёт в два приёма, и порядок здесь существенный. Сначала бинарники,
      # потом установщик: Velopack считает контрольные суммы содержимого при упаковке,
      # и подпись внутренних файлов после неё их бы сломала. Подписать только установщик
      # тоже мало — SmartScreen успокоится, а Defender будет ругаться на неподписанный
      # StormMachine.exe при каждом запуске.
      - name: Бинарники на подпись
        id: unsigned-app
        if: steps.probe.outputs.found == 'true' && env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-app
          path: artifacts/StormMachine.App

      - name: Подпись бинарников
        if: steps.probe.outputs.found == 'true' && env.HAS_SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: storm-machine
          signing-policy-slug: release-signing
          artifact-configuration-slug: app-files
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: artifacts/StormMachine.App

      # Установщик и лента обновлений. Velopack проверен спайком-07 на совместимость
      # с обрезкой — разбор ленты и разностные пакеты её переживают, в отличие от Quartz.
      - name: Установщик Velopack
        if: steps.probe.outputs.found == 'true'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''

          # Консоль и агент кладутся рядом с клиентом: продукт один, и ставить его
          # тремя установщиками значило бы заставить оператора собирать его руками.
          Copy-Item artifacts/StormMachine.Cli/* artifacts/StormMachine.App/ -Force -ErrorAction SilentlyContinue
          Copy-Item artifacts/StormMachine.Agent/* artifacts/StormMachine.App/ -Force -ErrorAction SilentlyContinue

          # Отладочные символы в установщик не идут: одни только libSkiaSharp.pdb
          # и libHarfBuzzSharp.pdb весят 105 МБ и человеку, который ставит продукт,
          # не нужны. Символы восстанавливаются из той же сборки, когда понадобятся.
          Remove-Item artifacts/StormMachine.App/*.pdb -Force -ErrorAction SilentlyContinue

          # Лента прошлых выпусков нужна для разностных пакетов: без неё каждое
          # обновление весило бы как полная установка.
          New-Item -ItemType Directory -Force -Path releases | Out-Null
          dotnet vpk download github --repoUrl "https://github.com/${{ github.repository }}" --outputDir releases 2>&1 | Out-Host
          if ($LASTEXITCODE -ne 0) { Write-Host "::notice::Прошлых выпусков нет — собираю первый" }

          # packId — это и каталог установки (%LocalAppData%\<packId>), и опознание
          # продукта в ленте обновлений. Он намеренно не совпадает с каталогом данных
          # (%LocalAppData%\StormMachine): там лежит storm.db с историей измерений,
          # и ставить продукт поверх неё значит сложить свои файлы в чужой каталог,
          # а при удалении унести историю с собой.
          dotnet vpk pack `
            --packId StormMachine.App `
            --packVersion $version `
            --packTitle "Storm Machine" `
            --packAuthors "Eterix Tech - by voidnery" `
            --packDir artifacts/StormMachine.App `
            --mainExe StormMachine.exe `
            --icon src/StormMachine.App/Assets/storm.ico `
            --outputDir releases


      - name: Установщик на подпись
        id: unsigned-setup
        if: steps.probe.outputs.found == 'true' && env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: releases/StormMachine.App-win-Setup.exe

      - name: Подпись установщика
        if: steps.probe.outputs.found == 'true' && env.HAS_SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: storm-machine
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: releases

      - name: Упаковка и контрольные суммы
        if: steps.probe.outputs.found == 'true'
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Compress-Archive -Path artifacts/* -DestinationPath "storm-machine-$tag-win-x64.zip" -Force

          # Суммы считаются по всему, что уходит человеку: и по архиву, и по установщику.
          # Неподписанный установщик — единственный способ убедиться, что скачано то самое.
          $files = @("storm-machine-$tag-win-x64.zip") + (Get-ChildItem releases -Filter '*.exe' | ForEach-Object { $_.FullName })
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash $f -Algorithm SHA256).Hash
            "$h  $(Split-Path $f -Leaf)"
          }
          $lines | Set-Content "SHA256SUMS.txt" -Encoding ascii
          $lines | Write-Host

      - name: Предупреждение о неподписанном выпуске
        if: steps.probe.outputs.found == 'true' && env.HAS_SIGNING != 'true'
        shell: pwsh
        run: |
          Write-Host "::warning::Выпуск не подписан: токен SignPath не задан. SmartScreen покажет предупреждение при установке. Проверять скачанное — по SHA256SUMS.txt."

      # Описание выпуска берётся из docs/RELEASES.md — раздел этой версии целиком.
      # До этого шапка RELEASES.md обещала «из этого файла берётся описание выпуска»,
      # а на деле GitHub собирал описание сам из заголовков коммитов, и написанное
      # для человека до страницы выпуска не доходило.
      #
      # Записи нет — выпуск не собирается. Мягкий вариант («соберём без описания»)
      # кончается черновиком, который публикуют не глядя: у пользователя на руках
      # установщик без единого слова о том, что в нём и чего от него не ждать.
      - name: Описание выпуска из RELEASES.md
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $text = Get-Content docs/RELEASES.md -Raw -Encoding utf8

          # Пробел после номера обязателен: иначе «0.2.0» совпало бы с «0.2.0-alpha.3».
          $pattern = '(?ms)^## ' + [regex]::Escape($version) + '\s.*?(?=^---\s*$|^## |\z)'
          $found = [regex]::Match($text, $pattern)

          if (-not $found.Success) {
            Write-Host "::error::В docs/RELEASES.md нет раздела «## $version» — выпуск без описания не собирается."
            exit 1
          }

          $found.Value.Trim() | Set-Content release-notes.md -Encoding utf8
          Get-Content release-notes.md -TotalCount 3 | Write-Host

      - name: Создание релиза
        uses: softprops/action-gh-release@v2
        with:
          name: Storm Machine ${{ github.ref_name }}
          # Сначала написанное человеком, под ним — список изменений, собранный GitHub.
          body_path: release-notes.md
          generate_release_notes: true
          draft: true          # черновик: оператор проверяет и публикует вручную
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            storm-machine-*.zip
            SHA256SUMS.txt
            releases/*.exe
            releases/*.nupkg
            releases/*.json
            releases/RELEASES
