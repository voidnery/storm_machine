name: CI

on:
  push:
    branches: [ beta, master ]
  pull_request:
    branches: [ beta, master ]
  workflow_dispatch:

# Продукт использует Windows-специфичные API (IPHLPAPI, DPAPI, Native Wifi),
# поэтому сборка и тесты идут только на Windows.
jobs:
  build:
    runs-on: windows-latest

    # Сорок минут вместо двадцати. Раннер примерно вдевятеро медленнее машины
    # разработки: те же проверки хранилища идут 4 секунды здесь и 35 там. Прогон
    # упёрся в двадцатиминутный потолок на восемнадцатой минуте и был снят на
    # полуслове — приговор при этом получила лишь часть сборок, а остальные
    # не успели даже начаться. Потолок нужен как страховка от зависания,
    # а не как мерка скорости раннера.
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # нужна вся история для детерминированной сборки и SourceLink

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Есть ли что собирать
        id: probe
        shell: pwsh
        run: |
          $projects = Get-ChildItem -Path src -Filter *.csproj -Recurse -ErrorAction SilentlyContinue
          if ($projects) {
            "found=true" >> $env:GITHUB_OUTPUT
            Write-Host "Найдено проектов: $($projects.Count)"
          } else {
            "found=false" >> $env:GITHUB_OUTPUT
            Write-Host "::notice::В src/ ещё нет проектов — сборка пропущена (итерация И-0 не завершена)"
          }

      - name: Restore
        if: steps.probe.outputs.found == 'true'
        run: dotnet restore

      - name: Build
        if: steps.probe.outputs.found == 'true'
        run: dotnet build --configuration Release --no-restore

      # Нагрузочные проверки здесь не идут — тем же правилом, что в приёмке
      # (tools/acceptance.sh, шаг 1). Причина не в экономии времени, хотя они и
      # съедали половину прогона: карта на 4096 узлов и год работы монитора
      # занимают все ядра и диск сразу, а на двухъядерном общем раннере рядом
      # с ними меряется не продукт, а планировщик Windows. Их место — стенд
      # оператора, где машина тихая; в приёмке они идут отдельным шагом.
      - name: Test
        if: steps.probe.outputs.found == 'true'
        run: dotnet test --configuration Release --no-build --filter "Категория!=Нагрузка" --logger "trx;LogFileName=results.trx" --results-directory TestResults

      # Публикация с обрезкой проверяется на каждом изменении, а не только при релизе.
      # Причина конкретная: сборка клиентов была сломана с И-3 по И-9 и никто этого
      # не заметил — тесты проходили, а обрезчик запускался только по тегу.
      - name: Проверка публикации с обрезкой
        if: steps.probe.outputs.found == 'true'
        run: |
          dotnet publish src/StormMachine.Cli/StormMachine.Cli.csproj --configuration Release
          dotnet publish src/StormMachine.App/StormMachine.App.csproj --configuration Release
          dotnet publish src/StormMachine.Agent/StormMachine.Agent.csproj --configuration Release

      - name: Публикация результатов тестов
        if: always() && steps.probe.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: ignore

      - name: Проверка подписи тега
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          echo "Тег: ${GITHUB_REF_NAME}"
          git tag -v "${GITHUB_REF_NAME}" 2>&1 | head -20 || echo "::warning::Подпись тега не проверена в CI (нужен allowed_signers)"
